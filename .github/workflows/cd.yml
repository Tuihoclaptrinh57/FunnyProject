name: CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions: { packages: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} }
      - uses: docker/metadata-action@v5
        id: meta-backend
        with: { images: ghcr.io/${{ github.repository }}/backend, tags: type=sha,prefix=,suffix=,format=short | type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }} | type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }} }
      - uses: docker/metadata-action@v5
        id: meta-web
        with: { images: ghcr.io/${{ github.repository }}/web, tags: type=sha,prefix=,suffix=,format=short | type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }} | type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }} }
      - uses: docker/build-push-action@v5
        with: { context: ./backend, file: ./backend/Dockerfile, push: true, tags: ${{ steps.meta-backend.outputs.tags }}, labels: ${{ steps.meta-backend.outputs.labels }}, cache-from: type=gha, cache-to: type=gha,mode=max }
      - uses: docker/build-push-action@v5
        with: { context: ./apps/web, file: ./apps/web/Dockerfile, push: true, tags: ${{ steps.meta-web.outputs.tags }}, labels: ${{ steps.meta-web.outputs.labels }}, cache-from: type=gha, cache-to: type=gha,mode=max }

  deploy-staging:
    if: github.ref == 'refs/heads/develop'
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - run: |
          echo "CD staging: ghcr.io/${{ github.repository }}/backend:develop + web:develop pushed"
          echo "Deploy to staging.smart.tobi / develop.smart.tobi via SSH/K8s/Helm"
          # kubectl set image deployment/smart-tobi-backend backend=ghcr.io/${{ github.repository }}/backend:develop
          # kubectl set image deployment/smart-tobi-web web=ghcr.io/${{ github.repository }}/web:develop

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: |
          echo "CD prod: ghcr.io/${{ github.repository }}/backend:latest + web:latest pushed"
          echo "Deploy to prod smart.tobi via Helm"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            README.md

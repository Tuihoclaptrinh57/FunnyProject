name: CodeQL

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]
  schedule: [{ cron: '0 6 * * 1' }]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [java, javascript]
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - if: matrix.language == 'java'
        name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - if: matrix.language == 'java'
        name: Build Java (for CodeQL)
        run: |
          if [ -f "backend/pom.xml" ]; then
            mvn -B compile -DskipTests -f backend/pom.xml || echo "compile failed - CodeQL build-mode none so continue"
          else
            echo "no backend/pom.xml yet - skip build"
          fi
      - if: matrix.language == 'javascript'
        name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache: npm removed - no package-lock.json at root (was failing "Dependencies lock file is not found")
      - if: matrix.language == 'javascript'
        name: Install JS deps
        run: npm ci --ignore-scripts || npm install || echo "no package-lock - skip"
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

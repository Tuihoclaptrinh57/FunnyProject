server:
  port: 8080

spring:
  threads:
    virtual:
      enabled: true  # Java 25 Virtual Threads - key for flash sale concurrency
  datasource:
    url: jdbc:postgresql://localhost:5432/livehub
    username: livehub
    password: livehub123
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer.value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer.value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    consumer.properties.spring.json.trusted.packages: "smart.tobi.*"

smart-tobi:
  flash:
    hold-ttl-seconds: 600
    queue-threshold: 500
  jwt:
    issuer: https://api.smart.tobi

management:
  endpoints.web.exposure.include: health,info,prometheus
  metrics.tags.application: smart-tobi

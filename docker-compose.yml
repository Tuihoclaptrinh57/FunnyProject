services:
  postgres:
    image: postgres:16-alpine
    ports: ['5432:5432']
    environment:
      POSTGRES_DB: livehub
      POSTGRES_USER: livehub
      POSTGRES_PASSWORD: livehub123
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U livehub"], interval: 5s, retries: 5 }
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  backend:
    build: { context: ./backend, dockerfile: Dockerfile }
    ports: ['8080:8080']
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/livehub
      SPRING_DATASOURCE_USERNAME: livehub
      SPRING_DATASOURCE_PASSWORD: livehub123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
  web:
    build: { context: ./apps/web, dockerfile: Dockerfile }
    ports: ['3000:3000']
    depends_on: [backend]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
  # Optional (comment out if not needed)
  # kafka:
  #   image: bitnami/kafka:3.7
  #   ports: ['9092:9092']
  #   environment:
  #     KAFKA_CFG_NODE_ID: 0
  #     KAFKA_CFG_PROCESS_ROLES: controller,broker
  #     KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  #     KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@localhost:9093
  #     KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: 'true'
  # qdrant:
  #   image: qdrant/qdrant
  #   ports: ['6333:6333']
volumes:
  postgres_data:
